<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse o cadastro de medicamentos da drogaria.">
  <meta name="theme-color" content="#eff6ff">
  <title>Entrar | Drogaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/login.js" defer></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <a class="login-brand" href="login.html" aria-label="Drogaria - página de login">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"></path>
            <path d="M12 7v10M7 12h10"></path>
          </svg>
        </span>
        <span>Drogaria RPA</span>
      </a>

      <div class="login-heading">
        <p class="eyebrow">ACESSO RESTRITO</p>
        <h1 id="login-title">Bem-vindo de volta</h1>
        <p>Entre para acessar o cadastro de medicamentos.</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field-item">
          <label for="loginUsuario">Usuário</label>
          <input id="loginUsuario" type="text" name="usuario" placeholder="Digite seu usuário" autocomplete="username" required autofocus>
        </div>
        <div class="field-item">
          <label for="loginSenha">Senha</label>
          <input id="loginSenha" type="password" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-button">
          <span>Entrar no sistema</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-7-7 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <p id="loginError" class="login-error" role="alert" aria-live="assertive"></p>
      <p class="login-footnote">Sistema de cadastro de medicamentos para testes RPA.</p>
    </section>
  </main>
</body>
</html>
